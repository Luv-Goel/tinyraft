[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyraft"
version = "1.0.0"
description = "Raft consensus from scratch + linearizable replicated KV store. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Luv Goel" }]
keywords = ["raft", "consensus", "distributed-systems", "replication", "key-value-store"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "pytest-cov"]
examples = ["aiohttp"]

[project.urls]
Homepage = "https://github.com/Luv-Goel/tinyraft"

[tool.setuptools.packages.find]
include = ["tinyraft*"]
